---
# Example inventory: copy it to inventory/<site>/ and use your own hosts.
#
#   login      RStudio Server + R (behind the load balancer)
#   compute    R only (batch jobs see the same environment)
#   ipa_server FreeIPA server where the workshop users are created

all:
  children:
    login:
      hosts:
        login-01.example.org:
        login-02.example.org:
        # spare node, kept out of the load balancer until needed
        login-03.example.org:
    compute:
      hosts:
        compute-[01:04].example.org:
    ipa_server:
      hosts:
        ipa-01.example.org:
