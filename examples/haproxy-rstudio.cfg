# HAProxy in front of RStudio Server on the login nodes (excerpt).
#
# At the symposium the same settings were made in the load balancer's web
# interface; this is the equivalent haproxy.cfg. Replace names, addresses and
# certificate with your own.
#
# - TLS terminates here: RStudio Server open source speaks plain HTTP.
# - Session persistence: on the first request HAProxy picks a login node and
#   inserts a cookie with that server's value (S1, S2, S3); the following
#   requests of the same browser go to the same node while the session is
#   active. Needed because the R session lives on one node only: without it
#   users would bounce between nodes and lose their session.
# - Server timeout of 1 hour, so that HAProxy does not close the long-lived
#   connections RStudio keeps open with the browser.
# - If a node fails the health check, its users are moved to another node and
#   must log in again (with a new R session).

frontend rstudio_https
    bind :443 ssl crt /etc/haproxy/certs/rstudio.example.org.pem
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend rstudio

backend rstudio
    mode http
    balance roundrobin
    timeout server 1h
    # RStudio answers / with a redirect to the sign-in page (3xx = healthy)
    option httpchk GET /
    cookie SERVERID insert indirect nocache
    server login-01 login-01.example.org:8787 check cookie S1
    server login-02 login-02.example.org:8787 check cookie S2
    # spare node: enable it when needed
    server login-03 login-03.example.org:8787 check cookie S3 disabled
